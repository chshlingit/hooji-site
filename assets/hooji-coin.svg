<?xml version="1.0" encoding="UTF-8"?>
<!-- Hooji 金幣主視覺（App Icon 與功能按鈕共用源）。
     Apple 極簡線條、全 vector、透明背景、中央 H；
     currentColor 讓深淺色模式都可辨識。上架 App Icon 由此匯出 1024px PNG（背景另加）。 -->
<svg width="100" height="100" viewBox="0 0 100 100" fill="none"
     xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-linecap="round">
  <!-- 外圈（金幣邊） -->
  <circle cx="50" cy="50" r="46.5" stroke-width="7"/>
  <!-- 內圈（幣面刻線） -->
  <circle cx="50" cy="50" r="36.3" stroke-width="3.15"/>
  <!-- 中央 H -->
  <path d="M 36.3 30.9 V 69.1 M 63.7 30.9 V 69.1 M 36.3 50 H 63.7" stroke-width="7"/>
</svg>
