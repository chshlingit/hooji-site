<?xml version="1.0" encoding="UTF-8"?>
<!-- 站台圖示：與 App Icon 同一組配色（金色漸層底 ＋ 深褐金幣）。
     favicon 實際顯示只有 16–32px，所以用**小尺寸版**的金幣幾何：
     省略內圈刻線、$ 放大加粗（來源 docs/brand/hooji-coin-small.svg）。
     這裡的座標是把 100 格線縮到 68 格（rect 內縮 16）後的結果。 -->
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBD177"/>
      <stop offset="1" stop-color="#E89A33"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#g)"/>
  <g fill="none" stroke="#3B2A18" stroke-linecap="round">
    <circle cx="50" cy="50" r="31.6" stroke-width="4.8"/>
    <path d="M 50 33.1 V 66.9" stroke-width="5.2"/>
    <path d="M 58.7 40.1 H 45.7 A 6.07 6.07 0 0 0 45.7 50
             H 54.3 A 6.07 6.07 0 0 1 54.3 62.1 H 39.6" stroke-width="5.2"/>
  </g>
</svg>
